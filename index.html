<style>
  .adult-gate-wrapper {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #121212;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    z-index: 999999;
    padding: 20px;
    box-sizing: border-box;
  }

  .adult-gate-card {
    background: #1e1e1e;
    border: 1px solid #333333;
    border-radius: 12px;
    padding: 30px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .adult-gate-badge {
    display: inline-block;
    background: #ff0055;
    color: #fff;
    font-weight: bold;
    font-size: 14px;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 15px;
  }

  .adult-gate-title {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 10px 0;
    line-height: 1.3;
  }

  .adult-gate-desc {
    font-size: 14px;
    color: #b0b0b0;
    margin-bottom: 25px;
    line-height: 1.5;
  }

  .adult-gate-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .adult-btn-primary {
    background: linear-gradient(45deg, #ff0055, #ff5500);
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    padding: 14px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }

  .adult-btn-primary:hover {
    opacity: 0.9;
    transform: translateY(-1px);
  }

  .adult-btn-secondary {
    background: transparent;
    color: #777777;
    font-size: 13px;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    padding: 8px;
  }

  .adult-btn-secondary:hover {
    color: #aaaaaa;
  }
</style>

<div class="adult-gate-wrapper">
  <div class="adult-gate-card">
    <span class="adult-gate-badge">18+ RESTRIKCJA WIEKOWA</span>
    <h2 class="adult-gate-title">Transmisje Na Żywo Bez Opłat</h2>
    <p class="adult-gate-desc">
      Dostęp do czatów na żywo jest przeznaczony wyłącznie dla osób pełnoletnich. Potwierdź swój wiek, aby przejść do darmowej rejestracji.
    </p>
    
    <div class="adult-gate-buttons">
      <button class="adult-btn-primary" onclick="przejdzDoOferty()">
        MAM UKOŃCZONE 18 LAT — WEJDŹ
      </button>
      <button class="adult-btn-secondary" onclick="odrzucWiek()">
        Mam mniej niż 18 lat (Wyjdź)
      </button>
    </div>
  </div>
</div>

<script>
  // TYM MIEJSCU PODMIEŃ LINK NA SWÓJ SMARTLINK AFILIACYJNY
  const mojSmartlink = "https://https://tiny.pl/qph73hzc2";

  function przejdzDoOferty() {
    window.location.href = mojSmartlink;
  }

  function odrzucWiek() {
    alert("Dostęp zabroniony. Zostaniesz przekierowany na stronę główną Google.");
    window.location.href = "https://www.google.com";
  }
</script>
